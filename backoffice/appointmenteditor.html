<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet4Clinic</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://adminlte.io/themes/v3/dist/css/adminlte.min.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css" />
    <!-- jQuery -->
    <script src="https://adminlte.io/themes/v3/plugins/jquery/jquery.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="https://adminlte.io/themes/v3/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.min.js"></script>
    <!-- AdminLTE App -->
    <script src="https://adminlte.io/themes/v3/dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bs-custom-file-input/dist/bs-custom-file-input.min.js"></script>

    <!-- Datepicker CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css"
    />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <!-- Bootstrap JavaScript -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

    <!-- DataTables JavaScript -->
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

    <!-- Datepicker JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>

</head>

<body class="hold-transition sidebar-mini">
    <div class="wrapper">
        <!-- Navbar -->
        <nav class="main-header navbar navbar-expand navbar-white navbar-light">
            <!-- Left navbar links -->
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#"><i class="fas fa-bars"></i></a>
                </li>
            </ul>
        </nav>
        <!-- /.navbar -->

        <!-- Main Sidebar Container -->
        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <!-- Brand Logo -->
            <a href="#" class="brand-link">
                <img id="logo-backoffice" src="https://adminlte.io/themes/v3/dist/img/AdminLTELogo.png" alt="AdminLTE Logo"
                    class="brand-image img-circle elevation-3" style="opacity: 0.8" />
                <span class="brand-text font-weight-light">Pet4Clinic</span>
            </a>
            <!-- Sidebar -->
            <div class="sidebar">
              <div class="user-panel mt-3 pb-3 mb-3 d-flex">
                <div class="info">
                  <a href="#" class="d-block">
                    <div id="sys_name"></div>
                  </a>
                </div>
              </div>
              <nav class="mt-2" id="sys_menu"></nav>
            </div>
            <!-- /.sidebar -->
        </aside>

        <!-- Content Wrapper. Contains page content -->
        <div class="content-wrapper">
            <!-- Main content -->
            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12 mt-3">
                            <h2 id="header"></h2>
                            <h4 id="p_detail"></h4>

                            <form id="submitForm" enctype="multipart/form-data">
                                <div class="card-body">
                                    <div class="form-group" id="form_t_id">
                                        <label for="id">รหัสการรักษา</label>
                                        <input type="text" class="form-control" id="t_id" placeholder="รหัสการรักษา" value=""
                                            disabled />
                                    </div>
                                    <div class="form-group" id="form_p_name">
                                        <label for="id">ชื่อผู้ป่วย</label>
                                        <input type="text" class="form-control" id="p_name" placeholder="ชื่อผู้ป่วย" value=""
                                            disabled />
                                    </div>
                                    <div class="form-group" id="form_p_type">
                                        <label for="id">ประเภท</label>
                                        <input type="text" class="form-control" id="p_type" placeholder="ประเภท" value=""
                                            disabled />
                                    </div>

                                    <div class="form-group">
                                        <label for="name">สัตวแพทย์</label>
                                        <select class="form-control" id="categorySelect"></select>
                                    </div>
                                    <div class="form-group">
                                        <label for="name">วันที่เข้ารับการรักษา</label>
                                        <div class="input-group">
                                          <div class="input-group-prepend">
                                            <span class="input-group-text">
                                              <i class="far fa-calendar-alt"></i>
                                            </span>
                                          </div>
                                          <input
                                            type="text"
                                            class="form-control"
                                            id="startDateInput"
                                            placeholder="เลือกวันเข้ารับการรักษา"
                                          />
                                        </div>
                                    </div>
                                    
                                    <div class="card-footer">
                                        <button type="submit" class="btn btn-primary">บันทึก</button>
                                        <button type="button" class="btn btn-secondary" onclick="history.back()">
                                            ยกเลิก
                                        </button>
                                    </div>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
            <!-- /.content -->
        </div>
        <!-- /.content-wrapper -->

        <!-- Main Footer -->
        <footer class="main-footer">
            <div class="float-right d-none d-sm-inline">Pet4Clinic</div>
            <strong>Copyright &copy; 2024</strong> All rights reserved.
        </footer>
    </div>

    <!-- Auth check -->
    <script src="js/script.js"></script>
    <script>
        $(document).ready(function () {

            $("#startDateInput")
          .datepicker({
            format: "dd/mm/yyyy",
            autoclose: true,
            todayHighlight: true,
          })
          .on("changeDate", function (selected) {
            var startDate = new Date(selected.date.valueOf());
          });

        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const action = urlParams.get("action");
        const p_id = urlParams.get("p_id");

        fetch("../services/pet.php?p_id=" + p_id, {
          method: "GET",
          headers: {
            Authorization: checkAuthorization(),
          },
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error(
                "Network response was not ok " + response.statusText
              );
            }
            return response.json();
          })
          .then((data) => {
            if (data.status == "success") {
              var typeName =
                data.data.p_type == "cat"
                  ? "แมว"
                  : data.data.p_type == "dog"
                  ? "สุนัข"
                  : "-";

              document.getElementById("p_detail").innerHTML =
                "ชื่อผู้ป่วย : " +
                data.data.p_name +
                "<br/>ผู้ติดต่อ : " +
                data.data.p_contact +
                "<br/>เบอร์ติดต่อ : " +
                data.data.p_phone +
                "<br/>อีเมล : " +
                data.data.p_email;

                fetch("../services/user.php?u_type=vet&u_active=1", {
                method: "GET",
                headers: {
                    Authorization: checkAuthorization(),
                },
                })
                .then(response => response.json())
                .then(data => loadData(data.data))
                .catch(error => console.error('Error fetching categories:', error));
            } else {
              alert(data.message);
              window.location.href = "pet.html";
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("An error occurred. Please try again.");
            window.location.href = "pet.html";
          });
        });
        
        document.getElementById("submitForm").addEventListener("submit", function (e) {
            e.preventDefault(); // ป้องกันการส่งฟอร์มแบบดั้งเดิม

            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const action = urlParams.get("action");
            const t_id = urlParams.get("t_id");
            const p_id = urlParams.get("p_id");

            var startDate = $("#startDateInput").val();
            startDate = convertDateFormat(startDate);
            console.log(startDate);
            if(startDate == '' ||startDate == null) {
                alert('กรุณาเลือกวันเข้ารับการรักษา');
                return
            }
            // สร้าง FormData สำหรับการส่งข้อมูล
            const formData = new FormData();
            formData.append("t_appointment", startDate);
            const u_id = document.getElementById("categorySelect").value;
            formData.append("u_id", u_id);

            
            if (action == "edit") {
                formData.append("t_id", t_id);
            } else {
                formData.append("p_id", p_id);
            }

            // จัดการส่งข้อมูลผ่าน API
            fetch(
                '../services/treatment.php?action='+action,
                {
                    method: "POST",
                    headers: {
                        Authorization: checkAuthorization(), // ตรวจสอบ Authorization การเข้าถึง API
                    },
                    body: formData, // ใช้ FormData ที่สร้าง
                }
            )
                .then((response) => response.json())
                .then((data) => {
                    if (data.status == "success") {
                        alert(data.message);
                        window.location.href = "appointment.html?id="+p_id; 
                    } else {
                        alert(data.message);
                    }
                })
                .catch((error) => {
                    console.error("Error:", error);
                    alert("An error occurred. Please try again.");
                });

                function convertDateFormat(dateString) {
                // Split the date string into day, month, and year
                if (dateString) {
                    var parts = dateString.split("/");
                    var day = parts[0];
                    var month = parts[1];
                    var year = parts[2];

                    // Convert to format yyyy-mm-dd
                    return `${year}-${month}-${day}`;
                }
                return "";
                }
        });
        
        function loadData(data) {
            const select = document.getElementById('categorySelect');
            data.forEach(category => {
                const option = document.createElement('option');
                option.value = category.u_id;
                option.textContent = category.u_name;
                select.appendChild(option);
            });


            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const action = urlParams.get("action");
            const t_id = urlParams.get("t_id");

            if (action) {
                if (action == "add") {
                    document.getElementById("header").innerText = "เพิ่มข้อมูลนัดหมาย";
                    document.getElementById("form_t_id").style.display = "none";
                    document.getElementById("form_p_name").style.display = "none";
                    document.getElementById("form_p_type").style.display = "none";
                    $("#startDateInput").datepicker("setStartDate", new Date());
                } else if (action == "edit" && t_id > 0) {
                    document.getElementById("header").innerText = "แก้ไขข้อมูลนัดหมาย";
                    document.getElementById("form_t_id").style.display = "block";
                    document.getElementById("form_p_name").style.display = "block";
                    document.getElementById("form_p_type").style.display = "block";

                    fetch(
                        "../services/treatment.php?t_id=" + t_id,
                        {
                            method: "GET",
                            headers: {
                                Authorization: checkAuthorization(),
                            },
                        }
                    )
                        .then((response) => {
                            if (!response.ok) {
                                throw new Error(
                                    "Network response was not ok " + response.statusText
                                );
                            }
                            return response.json();
                        })
                        .then((data) => {
                            if (data.status == "success") {

                                var typeName =
                                data.data.p_type == "cat"
                                ? "แมว"
                                : data.data.p_type == "dog"
                                ? "สุนัข"
                                : "-";
                                document.getElementById("t_id").value = data.data.t_id;
                                document.getElementById("p_name").value = data.data.p_name;
                                document.getElementById("p_type").value = typeName;

                                const selectElement = document.getElementById('categorySelect');
                                selectElement.value = data.data.u_id;
                                var today = new Date(data.data.t_appointment);
                                console.log(today);
                                $('#startDateInput').datepicker('setDate', today);
                                // document.getElementById("d_amount").value = data.data.d_amount;
                                // document.getElementById("d_price").value = data.data.d_price;
                                
                                // setStatus(data.data.d_active == "1");

                            } else {
                                alert(data.message);
                                window.location.href = "pet.html";
                            }
                        })
                        .catch((error) => {
                            console.error("Error:", error);
                            alert("An error occurred. Please try again.");
                            window.location.href = "pet.html";
                        });
                } else {
                    window.location.href = "index.html";
                }
            } else {
                window.location.href = "index.html";
            }
        }
    </script>
</body>

</html>
