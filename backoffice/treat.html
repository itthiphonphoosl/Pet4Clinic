<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet4Clinic</title>
    <!-- AdminLTE CSS -->
    <link
      rel="stylesheet"
      href="https://adminlte.io/themes/v3/dist/css/adminlte.min.css"
    />
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <!-- DataTables CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css"
    />
    <!-- jQuery -->
    <script src="https://adminlte.io/themes/v3/plugins/jquery/jquery.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="https://adminlte.io/themes/v3/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.min.js"></script>
    <!-- AdminLTE App -->
    <script src="https://adminlte.io/themes/v3/dist/js/adminlte.min.js"></script>
  </head>

  <body class="hold-transition sidebar-mini">
    <div class="wrapper">
      <!-- Navbar -->
      <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <!-- Left navbar links -->
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#"
              ><i class="fas fa-bars"></i
            ></a>
          </li>
        </ul>
      </nav>
      <!-- /.navbar -->

      <!-- Main Sidebar Container -->
      <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <!-- Brand Logo -->
        <a href="#" class="brand-link">
          <img
            id="logo-backoffice"
            src="https://adminlte.io/themes/v3/dist/img/AdminLTELogo.png"
            alt="AdminLTE Logo"
            class="brand-image img-circle elevation-3"
            style="opacity: 0.8"
          />
          <span class="brand-text font-weight-light">Pet4Clinic</span>
        </a>
        <!-- Sidebar -->
        <div class="sidebar">
          <div class="user-panel mt-3 pb-3 mb-3 d-flex">
            <div class="info">
              <a href="#" class="d-block">
                <div id="sys_name"></div>
              </a>
            </div>
          </div>
          <nav class="mt-2" id="sys_menu"></nav>
        </div>
        <!-- /.sidebar -->
      </aside>

      <!-- Content Wrapper. Contains page content -->
      <div class="content-wrapper">
        <!-- Main content -->
        <section class="content">
          <div class="container-fluid">
            <div class="row">
              <div class="col-12 mt-3">
                <h2>ข้อมูลการรักษา</h2>
                <table
                  id="dataTable"
                  class="table table-bordered table-hover"
                ></table>
              </div>
            </div>
          </div>
        </section>
        <!-- /.content -->
      </div>
      <!-- /.content-wrapper -->

      <footer class="main-footer">
        <div class="float-right d-none d-sm-inline">Pet4Clinic</div>
        <strong>Copyright &copy; 2024</strong> All rights reserved.
      </footer>
    </div>
    <!-- ./wrapper -->

    <!-- Auth check -->
    <script src="js/script.js"></script>
    <script>
      $(document).ready(function () {
        $("#dataTable").DataTable({
          dom: '<"top"f><"clear">rt<"bottom"lp><"clear">',
          drawCallback: function () {
            $(".dataTables_length").css("margin-top", "10px");
            $(".dataTables_paginate").css("margin-bottom", "5px");
          },
          ajax: {
            url: "../services/treatment.php?action=fordoc",
            type: "GET",
            dataSrc: function (json) {
              if (json.status === "success") {
                return json.data;
              } else {
                return [];
              }
            },
            beforeSend: function (request) {
              request.setRequestHeader("Authorization", checkAuthorization());
            },
          },
          columns: [
            { data: "t_id", title: "รหัสการรักษา" },
            { data: "t_detail", title: "รายละเอียดการรักษา" },
            { data: "p_name", title: "ชื่อผู้ป่วย" },
            {
              data: "p_type",
              title: "ประเภท",
              render: function (data, type, row) {
                return data == "dog" ? "สุนัข" : data == "cat" ? "แมว" : "-";
              },
            },
            { data: "p_contact", title: "ผู้ติดต่อ" },
            { data: "p_phone", title: "เบอร์ติดต่อ" },
            { data: "p_email", title: "อีเมล" },
            {
              data: "t_status",
              title: "สถานะ",
              render: function (data, type, row) {
                return data == "meet"
                  ? "รอพบแพทย์"
                  : data == "wait"
                  ? "กำลังรักษา"
                  : data == "finish"
                  ? "ชำระเงินแล้ว"
                  : data == "cancel"
                  ? "ยกเลิก"
                  : "-";
              },
            },
            {
              data: "t_appointment",
              title: "วันที่เข้ารับการรักษา",
              render: function (data, type, row) {
                return formatDateTime(data);
              },
            },
            {
              data: "t_status",
              title: "",
              render: function (data, type, row) {
                if (row.t_status == "meet") {
                  var treatUrl = `treateditor.html?t_id=${row.t_id}&p_id=${row.p_id}`;
                  return `<a href="${treatUrl}" class="btn btn-success">รักษา</a>`;
                } else if (row.t_status == "wait") {
                  var treatUrl = `treateditor.html?t_id=${row.t_id}&p_id=${row.p_id}`;
                  return `<a href="${treatUrl}" class="btn btn-success">รักษาต่อ</a>`;
                } else {
                  return "";
                }
              },
            },
          ],
        });
      });
    </script>
  </body>
</html>
