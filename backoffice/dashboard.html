<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet4Clinic</title>
    <!-- AdminLTE CSS -->
    <link
      rel="stylesheet"
      href="https://adminlte.io/themes/v3/dist/css/adminlte.min.css"
    />
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <!-- DataTables CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css"
    />
    <!-- jQuery -->
    <script src="https://adminlte.io/themes/v3/plugins/jquery/jquery.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="https://adminlte.io/themes/v3/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- AdminLTE App -->
    <script src="https://adminlte.io/themes/v3/dist/js/adminlte.min.js"></script>

    <!-- DataTables CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css"
    />

    <!-- Datepicker CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css"
    />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <!-- Bootstrap JavaScript -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

    <!-- DataTables JavaScript -->
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

    <!-- Datepicker JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
  </head>

  <body class="hold-transition sidebar-mini">
    <div class="wrapper">
      <!-- Navbar -->
      <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <!-- Left navbar links -->
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#"
              ><i class="fas fa-bars"></i
            ></a>
          </li>
        </ul>
      </nav>
      <!-- /.navbar -->

      <!-- Main Sidebar Container -->
      <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <!-- Brand Logo -->
        <a href="#" class="brand-link">
          <img
            id="logo-backoffice"
            src="https://adminlte.io/themes/v3/dist/img/AdminLTELogo.png"
            alt="AdminLTE Logo"
            class="brand-image img-circle elevation-3"
            style="opacity: 0.8"
          />
          <span class="brand-text font-weight-light">Pet4Clinic</span>
        </a>
        <!-- Sidebar -->
        <div class="sidebar">
          <div class="user-panel mt-3 pb-3 mb-3 d-flex">
            <div class="info">
              <a href="#" class="d-block">
                <div id="sys_name"></div>
              </a>
            </div>
          </div>
          <nav class="mt-2" id="sys_menu"></nav>
        </div>
        <!-- /.sidebar -->
      </aside>

      <!-- Content Wrapper. Contains page content -->
      <div class="content-wrapper">
        <!-- Content Header -->
        <section class="content-header">
          <div class="container-fluid">
            <div class="row mb-2">
              <div class="col-sm-6">
                <h1>แดชบอร์ด</h1>
              </div>
            </div>
          </div>
        </section>

        <!-- Main content -->
        <section class="content">
          <div class="col-12 mt-3">
            <div class="row">
              <!-- Start Date Picker -->
              <div class="col-md-5">
                <div class="form-group">
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text">
                        <i class="far fa-calendar-alt"></i>
                      </span>
                    </div>
                    <input
                      type="text"
                      class="form-control"
                      id="startDateInput"
                      placeholder="เลือกวันเริ่มต้น"
                    />
                  </div>
                </div>
              </div>

              <!-- End Date Picker -->
              <div class="col-md-5">
                <div class="form-group">
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text">
                        <i class="far fa-calendar-alt"></i>
                      </span>
                    </div>
                    <input
                      type="text"
                      class="form-control"
                      id="endDateInput"
                      placeholder="เลือกวันสิ้นสุด"
                    />
                  </div>
                </div>
              </div>
              <!-- Button for Filtering -->
              <div
                class="col-md-2 d-flex align-items-end"
                style="margin-bottom: 16px"
              >
                <button class="btn btn-primary btn-block" id="filterButton">
                  ค้นหา
                </button>
              </div>
            </div>
          </div>
          <div class="container-fluid">
            <!-- Small boxes (Stat box) -->
            <div class="row">
              <div class="col-lg-3 col-6">
                <div class="small-box bg-info">
                  <div class="inner">
                    <h3 id="total_income">0</h3>
                    <p>รายได้รวม</p>
                  </div>
                  <div class="icon">
                    <i class="fas fa-money-bill-alt"></i>
                  </div>
                  <!-- <a href="#" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a> -->
                </div>
              </div>

              <div class="col-lg-3 col-6">
                <div class="small-box bg-success">
                  <div class="inner">
                    <h3 id="count_sold_product">0</h3>
                    <p>ยาที่ใช้งาน</p>
                  </div>
                  <div class="icon">
                    <i class="fas fa-capsules"></i>
                  </div>
                  <!-- <a href="#" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a> -->
                </div>
              </div>
              <div class="col-lg-3 col-6">
                <div class="small-box bg-warning">
                  <div class="inner">
                    <h3 id="count_wait_delivery">0</h3>
                    <p>ผู้ป่วย</p>
                  </div>
                  <div class="icon">
                    <i class="fa fa-user-injured"></i>
                  </div>
                  <!-- <a href="#" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a> -->
                </div>
              </div>
              <div class="col-lg-3 col-6">
                <div class="small-box bg-danger">
                  <div class="inner">
                    <h3 id="count_customer">0</h3>
                    <p>สัตวแพทย์</p>
                  </div>
                  <div class="icon">
                    <i class="fas fa-users"></i>
                  </div>
                  <!-- <a href="#" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a> -->
                </div>
              </div>
              <!-- More boxes can be added here -->
            </div>
            <!-- /.row -->

            <!-- Main row -->
            <div class="row">
              <!-- Left col -->
              <section class="col-lg-12 connectedSortable">
                <canvas id="myBarChart"></canvas>

                <!-- /.card -->
              </section>
              <!-- /Left col -->

              <!-- Right col (We can insert a map or another chart here) -->
              <section class="col-lg-5 connectedSortable">
                <!-- Map card -->
                <div class="card bg-gradient-primary">
                  <!-- Card's content will go here -->
                </div>
                <!-- /.card -->
              </section>
              <!-- /Right col -->
            </div>
            <!-- /.row (main row) -->
          </div>
          <!-- /.container-fluid -->
        </section>
        <!-- /.content -->
      </div>
      <!-- /.content-wrapper -->

      <footer class="main-footer">
        <div class="float-right d-none d-sm-inline">Pet4Clinic</div>
        <strong>Copyright &copy; 2024</strong> All rights reserved.
      </footer>
    </div>
    <!-- ./wrapper -->

    <script src="js/script.js"></script>
    <script>
      var myBarChartInstance = null; // เก็บอินสแตนซ์ของ Chart.js

      $(document).ready(function () {
        // Start Date Picker
        $("#startDateInput")
          .datepicker({
            format: "dd/mm/yyyy",
            autoclose: true,
            todayHighlight: true,
          })
          .on("changeDate", function (selected) {
            var startDate = new Date(selected.date.valueOf());
            $("#endDateInput").datepicker("setStartDate", startDate); // Set minimum date for end date
          });

        // End Date Picker
        $("#endDateInput")
          .datepicker({
            format: "dd/mm/yyyy",
            autoclose: true,
            todayHighlight: true,
          })
          .on("changeDate", function (selected) {
            var endDate = new Date(selected.date.valueOf());
            $("#startDateInput").datepicker("setEndDate", endDate); // Set maximum date for start date
          });

        // Filter button click event
        $("#filterButton").on("click", function () {
          // Get values from start and end date inputs
          var startDate = $("#startDateInput").val();
          startDate = convertDateFormat(startDate);
          var endDate = $("#endDateInput").val();
          endDate = convertDateFormat(endDate);

          fetch(
            `services/report.php?action=dashboard&start=${startDate}&end=${endDate}`,
            {
              method: "GET",
              headers: {
                Authorization: checkAuthorization(),
              },
            }
          )
            .then((response) => response.json())
            .then((data) => {
              setupHeader(data.data);
            });
        });

        function convertDateFormat(dateString) {
          // Split the date string into day, month, and year
          if (dateString) {
            var parts = dateString.split("/");
            var day = parts[0];
            var month = parts[1];
            var year = parts[2];

            // Convert to format yyyy-mm-dd
            return `${year}-${month}-${day}`;
          }
          return "";
        }
      });

      document.addEventListener("DOMContentLoaded", function () {
        fetch("../services/report.php?action=dashboard", {
          method: "GET",
          headers: {
            Authorization: checkAuthorization(),
          },
        })
          .then((response) => response.json())
          .then((data) => {
            setupHeader(data.data);
          });
      });

      function setupHeader(data) {
        document.getElementById("total_income").innerHTML = parseInt(
          data.head_count_income == null ? "0" : data.head_count_income
        ).toLocaleString("en-US");
        document.getElementById("count_sold_product").innerHTML = parseInt(
          data.head_count_drug == null ? "0" : data.head_count_drug
        ).toLocaleString("en-US");
        document.getElementById("count_wait_delivery").innerHTML = parseInt(
          data.head_count_pet
        ).toLocaleString("en-US");
        document.getElementById("count_customer").innerHTML = parseInt(
          data.head_count_vet
        ).toLocaleString("en-US");

        const graphs = [
          {
            name: "วัคซีน (Vaccines)",
            total: data.count_vac == null ? "0" : data.count_vac,
          },
          {
            name: "ยาทาน (Oral Medications)",
            total: data.count_ora == null ? "0" : data.count_ora,
          },
          {
            name: "ยาทา (Topical Medications)",
            total: data.count_top == null ? "0" : data.count_top,
          },
        ];

        const labels = graphs.map((item) => item.name);
        const values = graphs.map((item) => parseInt(item.total));
        const backgroundColors = values.map(() => randomColor(0.2));
        const borderColors = values.map(() => randomColor(1));

        // ลบกราฟเดิมถ้ามี
        if (myBarChartInstance) {
          myBarChartInstance.destroy();
        }

        // สร้างกราฟใหม่
        const ctx = document.getElementById("myBarChart").getContext("2d");
        myBarChartInstance = new Chart(ctx, {
          type: "bar",
          data: {
            labels: labels,
            datasets: [
              {
                label: "จำนวนการใช้งานจำแนกตามประเภท",
                data: values,
                backgroundColor: backgroundColors,
                borderColor: borderColors,
                borderWidth: 1,
              },
            ],
          },
          options: {
            scales: {
              y: {
                beginAtZero: true,
              },
            },
          },
        });

        function randomColor(opacity) {
          return `rgba(${Math.floor(Math.random() * 256)}, ${Math.floor(
            Math.random() * 256
          )}, ${Math.floor(Math.random() * 256)}, ${opacity})`;
        }
      }
    </script>
  </body>
</html>
