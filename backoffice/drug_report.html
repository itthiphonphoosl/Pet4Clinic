<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet4Clinic</title>
    <!-- AdminLTE CSS -->
    <link
      rel="stylesheet"
      href="https://adminlte.io/themes/v3/dist/css/adminlte.min.css"
    />

    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />

    <!-- DataTables CSS (รวมอยู่แค่ครั้งเดียว) -->
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css"
    />

    <!-- Datepicker CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css"
    />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <!-- Bootstrap 4 (JavaScript) -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

    <!-- DataTables JavaScript (รวมอยู่แค่ครั้งเดียว) -->
    <script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.min.js"></script>

    <!-- Datepicker JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>

    <!-- AdminLTE App -->
    <script src="https://adminlte.io/themes/v3/dist/js/adminlte.min.js"></script>
  </head>

  <body class="hold-transition sidebar-mini">
    <div class="wrapper">
      <!-- Navbar -->
      <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <!-- Left navbar links -->
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#"
              ><i class="fas fa-bars"></i
            ></a>
          </li>
        </ul>
      </nav>
      <!-- /.navbar -->

      <!-- Main Sidebar Container -->
      <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <!-- Brand Logo -->
        <a href="#" class="brand-link">
          <img
            id="logo-backoffice"
            src="https://adminlte.io/themes/v3/dist/img/AdminLTELogo.png"
            alt="AdminLTE Logo"
            class="brand-image img-circle elevation-3"
            style="opacity: 0.8"
          />
          <span class="brand-text font-weight-light">Pet4Clinic</span>
        </a>
        <!-- Sidebar -->
        <div class="sidebar">
          <div class="user-panel mt-3 pb-3 mb-3 d-flex">
            <div class="info">
              <a href="#" class="d-block">
                <div id="sys_name"></div>
              </a>
            </div>
          </div>
          <nav class="mt-2" id="sys_menu"></nav>
        </div>
        <!-- /.sidebar -->
      </aside>

      <!-- Content Wrapper. Contains page content -->
      <div class="content-wrapper">
        <!-- Main content -->
        <section class="content">
          <div class="container-fluid">
            <div class="row">
              <div class="col-12 mt-3">
                <h2>รายงานข้อมูลยา</h2>
                <button class="btn btn-primary mb-3" id="downloadCsv">
                  ดาวน์โหลด CSV
                </button>
                <div class="col-12 mt-3">
                  <div class="row">
                    <!-- Start Date Picker -->
                    <div class="col-md-3" style="margin-left: -15px">
                      <div class="form-group">
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text">
                              <i class="far fa-calendar-alt"></i>
                            </span>
                          </div>
                          <input
                            type="text"
                            class="form-control"
                            id="startDateInput"
                            placeholder="วันที่เริ่มต้น"
                          />
                        </div>
                      </div>
                    </div>

                    <!-- End Date Picker -->
                    <div class="col-md-3">
                      <div class="form-group">
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text">
                              <i class="far fa-calendar-alt"></i>
                            </span>
                          </div>
                          <input
                            type="text"
                            class="form-control"
                            id="endDateInput"
                            placeholder="วันที่สิ้นสุด"
                          />
                        </div>
                      </div>
                    </div>

                    <div class="col-md-4">
                      <div class="form-group">
                        <div class="input-group">
                          <input
                            type="text"
                            class="form-control"
                            id="keyword"
                            placeholder="คำค้นหา..."
                          />
                        </div>
                      </div>
                    </div>

                    <!-- Button for Filtering -->
                    <div
                      class="col-md-2 d-flex align-items-end"
                      style="margin-bottom: 16px"
                    >
                      <button
                        class="btn btn-primary btn-block"
                        id="filterButton"
                      >
                        ค้นหา
                      </button>
                    </div>
                  </div>
                </div>

                <table
                  id="dataTable"
                  class="table table-bordered table-hover"
                ></table>
              </div>
            </div>
          </div>
        </section>
        <!-- /.content -->
      </div>
      <!-- /.content-wrapper -->

      <footer class="main-footer">
        <div class="float-right d-none d-sm-inline">Pet4Clinic</div>
        <strong>Copyright &copy; 2024</strong> All rights reserved.
      </footer>
    </div>
    <!-- ./wrapper -->

    <!-- Auth check -->
    <script src="js/script.js"></script>
    <script>
      $(document).ready(function () {
        // Start Date Picker
        $("#startDateInput")
          .datepicker({
            format: "dd/mm/yyyy",
            autoclose: true,
            todayHighlight: true,
          })
          .on("changeDate", function (selected) {
            var startDate = new Date(selected.date.valueOf());
            $("#endDateInput").datepicker("setStartDate", startDate); // Set minimum date for end date
          });

        // End Date Picker
        $("#endDateInput")
          .datepicker({
            format: "dd/mm/yyyy",
            autoclose: true,
            todayHighlight: true,
          })
          .on("changeDate", function (selected) {
            var endDate = new Date(selected.date.valueOf());
            $("#startDateInput").datepicker("setEndDate", endDate); // Set maximum date for start date
          });

        var table = $("#dataTable").DataTable({
          dom: '<"top"f><"clear">rt<"bottom"lp><"clear">',
          drawCallback: function () {
            $(".dataTables_length").css("margin-top", "10px");
            $(".dataTables_paginate").css("margin-bottom", "5px");
          },
          ajax: {
            url: "../services/report.php?action=paydrug",
            type: "GET",
            dataSrc: function (json) {
              // Check for successful status and return the 'data' array
              if (json.status === "success") {
                return json.data;
              } else {
                return []; // Return an empty array if the status is not 'success'
              }
            },
            beforeSend: function (request) {
              // Add custom headers here
              request.setRequestHeader("Authorization", checkAuthorization()); // Replace with your header value
            },
          },
          searching: false,
          columns: [
            { data: "d_id", title: "รหัสยา" },
            { data: "d_name", title: "ชื่อยา" },
            { data: "d_detail", title: "รายละเอียดยา" },
            {
              data: "total_sales",
              title: "ยอดจำหน่าย",
              render: function (data, type, row) {
                return parseFloat(data).toLocaleString("en-US");
              },
            },
          ],
        });
        $("#filterButton").on("click", function () {
          // Get values from start and end date inputs
          var startDate = $("#startDateInput").val();
          startDate = convertDateFormat(startDate);
          var endDate = $("#endDateInput").val();
          endDate = convertDateFormat(endDate);
          var keyword = $("#keyword").val();

          table.ajax
            .url(
              "../services/report.php?action=paydrug&start=" +
                startDate +
                "&end=" +
                endDate +
                "&keyword=" +
                keyword
            )
            .load(function (json) {
              table.clear();
              if (json.status === "success") {
                table.rows.add(json.data).draw();
              }
            });
        });
        function convertDateFormat(dateString) {
          // Split the date string into day, month, and year
          var parts = dateString.split("/");
          var day = parts[0];
          var month = parts[1];
          var year = parts[2];

          // Convert to format yyyy-mm-dd
          if (dateString != "") {
            return `${year}-${month}-${day}`;
          } else {
            return "";
          }
        }

        $("#downloadCsv").click(function () {
          downloadCSV();
        });

        function downloadCSV() {
          let csv = [];
          let rows = document.querySelectorAll("#dataTable tr");

          for (let i = 0; i < rows.length; i++) {
            let row = [],
              cols = rows[i].querySelectorAll("td, th");
            for (let j = 0; j < cols.length; j++) {
              let cellText = cols[j].innerText;

              // ลบคอมม่าออกจากตัวเลขเพื่อหลีกเลี่ยงปัญหาในการคำนวณ
              if (!isNaN(cellText.replace(/,/g, ""))) {
                cellText = cellText.replace(/,/g, "");
              }

              row.push(cellText);
            }
            csv.push(row.join(","));
          }

          // เพิ่ม BOM สำหรับการเข้ารหัส UTF-8 เพื่อรองรับตัวอักษรภาษาไทย
          let csvString = "\uFEFF" + csv.join("\n");

          // สร้างไฟล์ CSV Blob และดาวน์โหลด
          let blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
          let link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "report_drug.csv";
          link.click();
        }
      });
    </script>
  </body>
</html>
