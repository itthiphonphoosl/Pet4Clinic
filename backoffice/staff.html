<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet4Clinic</title>
    <!-- AdminLTE CSS -->
    <link
      rel="stylesheet"
      href="https://adminlte.io/themes/v3/dist/css/adminlte.min.css"
    />
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <!-- DataTables CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css"
    />
    <!-- jQuery -->
    <script src="https://adminlte.io/themes/v3/plugins/jquery/jquery.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="https://adminlte.io/themes/v3/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.min.js"></script>
    <!-- AdminLTE App -->
    <script src="https://adminlte.io/themes/v3/dist/js/adminlte.min.js"></script>
  </head>

  <body class="hold-transition sidebar-mini">
    <div class="wrapper">
      <!-- Navbar -->
      <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <!-- Left navbar links -->
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#"
              ><i class="fas fa-bars"></i
            ></a>
          </li>
        </ul>
      </nav>
      <!-- /.navbar -->

      <!-- Main Sidebar Container -->
      <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <!-- Brand Logo -->
        <a href="#" class="brand-link">
          <img
            id="logo-backoffice"
            src="https://adminlte.io/themes/v3/dist/img/AdminLTELogo.png"
            alt="AdminLTE Logo"
            class="brand-image img-circle elevation-3"
            style="opacity: 0.8"
          />
          <span class="brand-text font-weight-light">Pet4Clinic</span>
        </a>
        <!-- Sidebar -->
        <div class="sidebar">
          <div class="user-panel mt-3 pb-3 mb-3 d-flex">
            <div class="info">
              <a href="#" class="d-block">
                <div id="sys_name"></div>
              </a>
            </div>
          </div>
          <nav class="mt-2" id="sys_menu"></nav>
        </div>
        <!-- /.sidebar -->
      </aside>

      <!-- Content Wrapper. Contains page content -->
      <div class="content-wrapper">
        <!-- Main content -->
        <section class="content">
          <div class="container-fluid">
            <div class="row">
              <div class="col-12 mt-3">
                <h2>ข้อมูลพนักงาน</h2>
                <button
                  class="btn btn-primary mb-3"
                  onclick="location.href='staffeditor.html?action=add';"
                >
                  + เพิ่มพนักงาน
                </button>
                <table
                  id="dataTable"
                  class="table table-bordered table-hover"
                ></table>
              </div>
            </div>
          </div>
        </section>
        <!-- /.content -->
      </div>
      <!-- /.content-wrapper -->

      <footer class="main-footer">
        <div class="float-right d-none d-sm-inline">Pet4Clinic</div>
        <strong>Copyright &copy; 2024</strong> All rights reserved.
      </footer>
    </div>
    <!-- ./wrapper -->

    <!-- Auth check -->
    <script src="js/script.js"></script>
    <script>
      $(document).ready(function () {
        $("#dataTable").DataTable({
          dom: '<"top"f><"clear">rt<"bottom"lp><"clear">',
          drawCallback: function () {
            $(".dataTables_length").css("margin-top", "10px");
            $(".dataTables_paginate").css("margin-bottom", "5px");
          },
          ajax: {
            url: "../services/user.php?u_type=sta",
            type: "GET",
            dataSrc: function (json) {
              if (json.status === "success") {
                return json.data;
              } else {
                return [];
              }
            },
            beforeSend: function (request) {
              request.setRequestHeader("Authorization", checkAuthorization());
            },
          },
          columns: [
            { data: "u_id", title: "รหัสพนักงาน" },
            { data: "u_name", title: "ชื่อพนักงาน" },
            { data: "u_phone", title: "เบอร์ติดต่อ" },
            { data: "u_username", title: "ยูเซอร์เนม" },
            {
              data: "u_active",
              title: "สถานะ",
              render: function (data, type, row) {
                return data == 1 ? "ใช้งาน" : "ไม่ใช้งาน";
              },
            },
            {
              data: null,
              title: "",
              render: function (data, type, row) {
                var editUrl = `staffeditor.html?id=${data.u_id}&action=edit`;
                return `<a href="${editUrl}" class="btn btn-primary">แก้ไข</a>  <a href="#"" class="btn btn-secondary" id="changepw" onclick="changepw('${data.u_username}','${data.u_phone}')">เปลี่ยนรหัสผ่าน</a>`;
              },
            },
          ],
        });
        $(document).on("click", "#changepw", function () {
          var u_username = $(this).data("username");
          var u_phone = $(this).data("phone");
        });
      });

      function changepw(u_username, u_phone) {
        var userInput = prompt(
          "เปลี่ยนรหัสผ่าน สำหรับ " + u_username + ":",
          "กรุณากรอกรหัสผ่านใหม่"
        );
        if (userInput != null) {
          const formData = new FormData();
          formData.append("u_username", u_username);
          formData.append("u_phone", u_phone);
          formData.append("u_password_new", userInput);

          fetch("../services/user.php?action=forgot", {
            method: "POST",
            headers: {
              Authorization: checkAuthorization(),
            },
            body: formData, // ใช้ FormData ที่สร้าง
          })
            .then((response) => {
              if (!response.ok) {
                throw new Error(
                  "Network response was not ok " + response.statusText
                );
              }
              return response.json();
            })
            .then((data) => {
              alert(data.message);
              window.location.href = "staff.html";
            })
            .catch((error) => {
              console.error("Error:", error);
              alert("An error occurred. Please try again.");
              window.location.href = "staff.html";
            });
        }
      }
    </script>
  </body>
</html>
