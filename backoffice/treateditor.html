<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet4Clinic</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://adminlte.io/themes/v3/dist/css/adminlte.min.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css" />
    <!-- jQuery -->
    <script src="https://adminlte.io/themes/v3/plugins/jquery/jquery.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="https://adminlte.io/themes/v3/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.min.js"></script>
    <!-- AdminLTE App -->
    <script src="https://adminlte.io/themes/v3/dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bs-custom-file-input/dist/bs-custom-file-input.min.js"></script>

</head>

<body class="hold-transition sidebar-mini">
    <div class="wrapper">
        <!-- Navbar -->
        <nav class="main-header navbar navbar-expand navbar-white navbar-light">
            <!-- Left navbar links -->
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#"><i class="fas fa-bars"></i></a>
                </li>
            </ul>
        </nav>
        <!-- /.navbar -->

        <!-- Main Sidebar Container -->
        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <!-- Brand Logo -->
            <a href="#" class="brand-link">
                <img id="logo-backoffice" src="https://adminlte.io/themes/v3/dist/img/AdminLTELogo.png" alt="AdminLTE Logo"
                    class="brand-image img-circle elevation-3" style="opacity: 0.8" />
                <span class="brand-text font-weight-light">Pet4Clinic</span>
            </a>
            <!-- Sidebar -->
            <div class="sidebar">
              <div class="user-panel mt-3 pb-3 mb-3 d-flex">
                <div class="info">
                  <a href="#" class="d-block">
                    <div id="sys_name"></div>
                  </a>
                </div>
              </div>
              <nav class="mt-2" id="sys_menu"></nav>
            </div>
            <!-- /.sidebar -->
        </aside>

        <!-- Content Wrapper. Contains page content -->
        <div class="content-wrapper">
            <!-- Main content -->
            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12 mt-3">
                            <h2 id="header">ข้อมูลการรักษา</h2>
                            <br />
                            <h4 id="p_detail"></h4>
                            <form id="submitForm" enctype="multipart/form-data">
                                <div class="card-body">
                                    <div class="form-group">
                                        <label for="name">รายละเอียดการรักษา</label>
                                        <textarea class="form-control" id="t_detail" rows="3" placeholder="รายละเอียดการรักษา ..."></textarea>
                                    </div>
                                    <div class="form-group">
                                        <label for="name">ค่าบริการ</label>
                                        <input type="number" step="1" min="0" class="form-control" id="t_price_other" placeholder="ราคา"
                                            required />
                                    </div>
                                    
                                    
                                    <div class="form-group">
                                        <button id="addDetailButton" type="button" class="btn btn-success mb-3">+ เพิ่มรายการยา</button>
                                        <div id="detailContainer"></div>
                                    </div>
                                    <div class="card-footer">
                                        <button type="submit" class="btn btn-primary">บันทึก</button>
                                        <button type="button" class="btn btn-secondary" onclick="history.back()">
                                            ยกเลิก
                                        </button>
                                    </div>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
            <!-- /.content -->
        </div>
        <!-- /.content-wrapper -->

        <!-- Main Footer -->
        <footer class="main-footer">
            <div class="float-right d-none d-sm-inline">Pet4Clinic</div>
            <strong>Copyright &copy; 2024</strong> All rights reserved.
        </footer>
    </div>

    <!-- Auth check -->
    <script src="js/script.js"></script>
    <script>
        $(document).ready(function () {
          const queryString = window.location.search;
          const urlParams = new URLSearchParams(queryString);
          const action = urlParams.get("action");
          const p_id = urlParams.get("p_id");
          const t_id = urlParams.get("t_id");
    
          fetch("../services/drug.php", {
            method: "GET",
            headers: {
              Authorization: checkAuthorization(),
            },
          })
            .then((response) => {
              if (!response.ok) {
                throw new Error(
                  "Network response was not ok " + response.statusText
                );
              }
              return response.json();
            })
            .then((data) => {
                var drugDropdown = '';
                data.data.forEach(category => {
                    
                    drugDropdown += ('<option value="' + category.d_id +'">'+category.d_type_desc+' : '+category.d_name+' (คงเหลือ ' + category.d_amount+ ')</option>');
                });
                window.globalDrug = drugDropdown;


                fetch(
                        "../services/treatment.php?t_id=" + t_id,
                        {
                            method: "GET",
                            headers: {
                                Authorization: checkAuthorization(),
                            },
                        }
                    )
                        .then((response) => {
                            if (!response.ok) {
                                throw new Error(
                                    "Network response was not ok " + response.statusText
                                );
                            }
                            return response.json();
                        })
                        .then((data) => {
                            if (data.status == "success") {

                                document.getElementById("t_detail").value = data.data.t_detail;

                                document.getElementById("t_price_other").value = data.data.t_price_other;
                                
                                data.data.details.forEach(detail => {
                                    setDetailButton(detail.d_id, detail.d_amount);
                                });

                            } else {
                                alert(data.message);
                                window.location.href = "treat.html";
                            }
                        })
                        .catch((error) => {
                            console.error("Error:", error);
                            alert("An error occurred. Please try again.");
                            window.location.href = "treat.html";
                        });
            })
            .catch((error) => {
              console.error("Error:", error);
              alert("An error occurred. Please try again.");
              window.history.back();
            });

          fetch("../services/pet.php?p_id=" + p_id, {
            method: "GET",
            headers: {
              Authorization: checkAuthorization(),
            },
          })
            .then((response) => {
              if (!response.ok) {
                throw new Error(
                  "Network response was not ok " + response.statusText
                );
              }
              return response.json();
            })
            .then((data) => {
              if (data.status == "success") {
                var typeName =
                  data.data.p_type == "cat"
                    ? "แมว"
                    : data.data.p_type == "dog"
                    ? "สุนัข"
                    : "-";
    
                document.getElementById("p_detail").innerHTML =
                  "ชื่อผู้ป่วย : " +
                  data.data.p_name +
                  "<br/>ผู้ติดต่อ : " +
                  data.data.p_contact +
                  "<br/>เบอร์ติดต่อ : " +
                  data.data.p_phone +
                  "<br/>อีเมล : " +
                  data.data.p_email;
              } else {
                alert(data.message);
                window.history.back();
              }
            })
            .catch((error) => {
              console.error("Error:", error);
              alert("An error occurred. Please try again.");
              window.history.back();
            });
        });

        document.getElementById('addDetailButton').addEventListener('click', function () {
            event.preventDefault();
            const detailContainer = document.getElementById('detailContainer');
            setDetailButton('', 0);
        });


        function setDetailButton(valueDropdown, valuePrice) {

// สร้างแถวใหม่
const row = document.createElement('div');
row.classList.add('row', 'mb-12');

// สร้างคอลัมน์สำหรับ select ขนาด
const colSize = document.createElement('div');
colSize.classList.add('col-lg-8');
const select = document.createElement('select');
select.classList.add('form-control');
select.setAttribute('name', 'd_ids[]');
select.innerHTML = window.globalDrug;
if (valueDropdown != '') {
    select.value = valueDropdown;
}
colSize.appendChild(select);

// สร้างคอลัมน์สำหรับใส่ราคา
const colPrice = document.createElement('div');
colPrice.classList.add('col-lg-3');
const input = document.createElement('input');
input.type = 'number';
if (valuePrice > 0) {
    input.value = valuePrice;
} else {
    input.value = '0';
}
input.min = '0';
input.classList.add('form-control');
input.setAttribute('name', 'd_amounts[]');
input.placeholder = 'จำนวน';
colPrice.appendChild(input);

// สร้างคอลัมน์สำหรับปุ่มลบ
const colDelete = document.createElement('div');
colDelete.classList.add('col-lg-1');
const deleteButton = document.createElement('button');
deleteButton.classList.add('btn', 'btn-danger', 'mb-3');
deleteButton.textContent = 'ลบ';

// เพิ่มฟังก์ชันลบแถวเมื่อกดปุ่มลบ
deleteButton.addEventListener('click', function () {
    detailContainer.removeChild(row);
});

colDelete.appendChild(deleteButton);

// เพิ่มคอลัมน์ทั้งหมดเข้ากับแถว
row.appendChild(colSize);
row.appendChild(colPrice);
row.appendChild(colDelete);

// เพิ่มแถวเข้าไปใน detailContainer
detailContainer.appendChild(row);
}

document.getElementById("submitForm").addEventListener("submit", function (e) {
            e.preventDefault(); // ป้องกันการส่งฟอร์มแบบดั้งเดิม

            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const action = urlParams.get("action");
            const t_id = urlParams.get("t_id");
            const p_id = urlParams.get("p_id");

            // รวบรวมข้อมูลฟอร์ม
            const t_detail = document.getElementById("t_detail").value;
            const t_price_other = document.getElementById("t_price_other").value;

            const drugIDElements = document.getElementsByName("d_ids[]");
            const amountElements = document.getElementsByName("d_amounts[]");
            let details = [];
            let drugIDs = new Set(); // ใช้ Set เพื่อเก็บ drugID ที่ไม่ซ้ำกัน
            let isDuplicate = false;
            let isPriceZero = false;

            for (let i = 0; i < drugIDElements.length; i++) {
                const drugIDValue = drugIDElements[i].value;
                const amountValue = amountElements[i].value;
                if (drugIDs.has(drugIDValue)) {
                    isDuplicate = true; // ถ้ามี drugID อยู่ใน Set แสดงว่าซ้ำ
                    break; // ออกจากลูปทันทีเพราะเจอที่ซ้ำแล้ว
                }
                if(amountValue == 0) {
                    isPriceZero = true;
                    break;
                }

                drugIDs.add(drugIDValue); // ถ้ายังไม่ซ้ำ เพิ่มลงใน Set
                details.push({
                    d_id: drugIDValue,
                    d_amount: amountValue
                });
            }
            if (isDuplicate) {
                alert('มีรายการยาซ้ำ');
                return;
            } else 
            if (isPriceZero) {
                alert('มียาบางตัวยังไม่ได้กรอกจำนวน');
                return;
            }


            // สร้าง FormData สำหรับการส่งข้อมูล
            const formData = new FormData();
            formData.append("t_detail", t_detail);
            formData.append("t_price_other", t_price_other);
            formData.append("treatment_detail", JSON.stringify(details));
            formData.append("t_id", t_id);

            // จัดการส่งข้อมูลผ่าน API
            fetch(
                "../services/treatment.php?action=treat",
                {
                    method: "POST",
                    headers: {
                        Authorization: checkAuthorization(), // ตรวจสอบ Authorization การเข้าถึง API
                    },
                    body: formData, // ใช้ FormData ที่สร้าง
                }
            )
                .then((response) => response.json())
                .then((data) => {
                    if (data.status == "success") {
                        alert(data.message);
                        window.location.href = "treat.html";
                    } else {
                        alert(data.message);
                    }
                })
                .catch((error) => {
                    console.error("Error:", error);
                    alert("An error occurred. Please try again.");
                });
        });


    </script>
</body>

</html>
