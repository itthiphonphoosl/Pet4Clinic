<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet4Clinic</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://adminlte.io/themes/v3/dist/css/adminlte.min.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css" />
    <!-- jQuery -->
    <script src="https://adminlte.io/themes/v3/plugins/jquery/jquery.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="https://adminlte.io/themes/v3/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.min.js"></script>
    <!-- AdminLTE App -->
    <script src="https://adminlte.io/themes/v3/dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bs-custom-file-input/dist/bs-custom-file-input.min.js"></script>

</head>

<body class="hold-transition sidebar-mini">
    <div class="wrapper">
        <!-- Navbar -->
        <nav class="main-header navbar navbar-expand navbar-white navbar-light">
            <!-- Left navbar links -->
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#"><i class="fas fa-bars"></i></a>
                </li>
            </ul>
        </nav>
        <!-- /.navbar -->

        <!-- Main Sidebar Container -->
        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <!-- Brand Logo -->
            <a href="#" class="brand-link">
                <img id="logo-backoffice" src="https://adminlte.io/themes/v3/dist/img/AdminLTELogo.png" alt="AdminLTE Logo"
                    class="brand-image img-circle elevation-3" style="opacity: 0.8" />
                <span class="brand-text font-weight-light">Pet4Clinic</span>
            </a>
            <!-- Sidebar -->
            <div class="sidebar">
              <div class="user-panel mt-3 pb-3 mb-3 d-flex">
                <div class="info">
                  <a href="#" class="d-block">
                    <div id="sys_name"></div>
                  </a>
                </div>
              </div>
              <nav class="mt-2" id="sys_menu"></nav>
            </div>
            <!-- /.sidebar -->
        </aside>

        <!-- Content Wrapper. Contains page content -->
        <div class="content-wrapper">
            <!-- Main content -->
            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12 mt-3">
                            <h2 id="header"></h2>

                            <form id="submitForm" enctype="multipart/form-data">
                                <div class="card-body">
                                    <div class="form-group" id="form_p_id">
                                        <label for="id">รหัสผู้ป่วย</label>
                                        <input type="text" class="form-control" id="p_id" placeholder="รหัสผู้ป่วย" value=""
                                            disabled />
                                    </div>
                                    <div class="form-group">
                                        <label for="name">ชื่อผู้ป่วย</label>
                                        <input type="text" class="form-control" id="p_name" placeholder="ชื่อผู้ป่วย"
                                            required />
                                    </div>
                                    <div class="form-group">
                                        <label for="name">ประเภท</label>
                                        <select class="form-control" id="categorySelect"></select>
                                    </div>

                                    <div class="form-group">
                                        <label for="name">ผู้ติดต่อ</label>
                                        <input type="text" class="form-control" id="p_contact" placeholder="ผู้ติดต่อ"
                                            required />
                                    </div>
                                    <div class="form-group">
                                        <label for="name">เบอร์ติดต่อ</label>
                                        <input type="text" class="form-control" id="p_phone" placeholder="เบอร์ติดต่อ"
                                            required />
                                    </div>
                                    <div class="form-group">
                                        <label for="name">อีเมล</label>
                                        <input type="text" class="form-control" id="p_email" placeholder="อีเมล"
                                            required />
                                    </div>
                                    
                                    <div class="card-footer">
                                        <button type="submit" class="btn btn-primary">บันทึก</button>
                                        <button type="button" class="btn btn-secondary" onclick="history.back()">
                                            ยกเลิก
                                        </button>
                                    </div>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
            <!-- /.content -->
        </div>
        <!-- /.content-wrapper -->

        <!-- Main Footer -->
        <footer class="main-footer">
            <div class="float-right d-none d-sm-inline">Pet4Clinic</div>
            <strong>Copyright &copy; 2024</strong> All rights reserved.
        </footer>
    </div>

    <!-- Auth check -->
    <script src="js/script.js"></script>
    <script>
        $(document).ready(function () {
            populateSelect(
                [
                    {'key':'cat','name':'แมว'}, 
                    {'key':'dog','name':'สุนัข'}
                ]);
        });

        // function setStatus(isActive) {
        //     if (isActive) {
        //         document.getElementById("active").checked = true;
        //     } else {
        //         document.getElementById("inactive").checked = true;
        //     }
        // }

        document.getElementById("submitForm").addEventListener("submit", function (e) {
            e.preventDefault(); // ป้องกันการส่งฟอร์มแบบดั้งเดิม

            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const action = urlParams.get("action");
            const id = urlParams.get("id");

            // รวบรวมข้อมูลฟอร์ม
            const p_name = document.getElementById("p_name").value;
            const p_type = document.getElementById("categorySelect").value;
            const p_contact = document.getElementById("p_contact").value;
            const p_phone = document.getElementById("p_phone").value;
            const p_email = document.getElementById("p_email").value;
            // const status = document.querySelector('input[name="status"]:checked').value;

            // สร้าง FormData สำหรับการส่งข้อมูล
            const formData = new FormData();
            formData.append("p_name", p_name);
            formData.append("p_type", p_type);
            formData.append("p_contact", p_contact);
            formData.append("p_phone", p_phone);
            formData.append("p_email", p_email);
            // formData.append("pro_active", status);
            
            if (action == "edit") {
                formData.append("p_id", id);
            }
            // จัดการส่งข้อมูลผ่าน API
            fetch(
                '../services/pet.php?action='+action,
                {
                    method: "POST",
                    headers: {
                        Authorization: checkAuthorization(), // ตรวจสอบ Authorization การเข้าถึง API
                    },
                    body: formData, // ใช้ FormData ที่สร้าง
                }
            )
                .then((response) => response.json())
                .then((data) => {
                    if (data.status == "success") {
                        alert(data.message);
                        window.location.href = "pet.html"; 
                    } else {
                        alert(data.message);
                    }
                })
                .catch((error) => {
                    console.error("Error:", error);
                    alert("An error occurred. Please try again.");
                });
        });

        function populateSelect(data) {
            const select = document.getElementById('categorySelect');
            data.forEach(category => {
                const option = document.createElement('option');
                option.value = category.key;
                option.textContent = category.name;
                select.appendChild(option);
            });

            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const action = urlParams.get("action");
            const id = urlParams.get("id");

            if (action) {
                if (action == "add") {
                    document.getElementById("header").innerText = "เพิ่มข้อมูลผู้ป่วย";
                    document.getElementById("form_p_id").style.display = "none";
                } else if (action == "edit" && id > 0) {
                    document.getElementById("header").innerText = "แก้ไขข้อมูลผู้ป่วย";
                    document.getElementById("form_p_id").style.display = "block";

                    fetch(
                        "../services/pet.php?p_id=" + id,
                        {
                            method: "GET",
                            headers: {
                                Authorization: checkAuthorization(),
                            },
                        }
                    )
                        .then((response) => {
                            if (!response.ok) {
                                throw new Error(
                                    "Network response was not ok " + response.statusText
                                );
                            }
                            return response.json();
                        })
                        .then((data) => {
                            if (data.status == "success") {

                                document.getElementById("p_id").value = data.data.p_id;
                                document.getElementById("p_name").value = data.data.p_name;
                                const selectElement = document.getElementById('categorySelect');
                                selectElement.value = data.data.p_type;
                                document.getElementById("p_contact").value = data.data.p_contact;
                                document.getElementById("p_phone").value = data.data.p_phone;
                                document.getElementById("p_email").value = data.data.p_email;
                                
                                // setStatus(data.data.pro_active == "1");

                            } else {
                                alert(data.message);
                                window.location.href = "pet.html";
                            }
                        })
                        .catch((error) => {
                            console.error("Error:", error);
                            alert("An error occurred. Please try again.");
                            window.location.href = "pet.html";
                        });
                } else {
                    window.location.href = "index.html";
                }
            } else {
                window.location.href = "index.html";
            }
        }

    </script>
</body>

</html>
